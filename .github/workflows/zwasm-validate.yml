name: Validate ZWASM host and build scripts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests
      - run: node --check web/zwasm.js
      - run: node --check web/zwasm_host.js
      - run: node tests/test_zdll_loader.js
      - run: python -m py_compile packager/*.py tools/*.py
